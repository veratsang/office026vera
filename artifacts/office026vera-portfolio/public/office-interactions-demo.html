<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>office026vera · 交互验收</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f7f7;color:#29292b;font:14px/1.65 system-ui,sans-serif}main{max-width:1500px;margin:auto;padding:24px}h1{font:400 28px Georgia,serif;margin:0 0 8px}p{margin:8px 0;color:#696368}.controls{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin:18px 0}button,select{font:inherit;color:#805d6c;background:none;border:1px solid #d5d2d3;padding:7px 12px;cursor:pointer}button:focus-visible,a:focus-visible,select:focus-visible{outline:2px solid #b88494;outline-offset:3px}button[aria-pressed=true]{border-color:#986c7a;color:#29292b}label{display:inline-flex;gap:7px;align-items:center}.viewport{border:1px solid #d5d2d3;overflow:hidden}iframe{border:0;display:block;transform-origin:top left}output{display:block;white-space:pre-wrap;padding:12px 0;font:11px/1.7 monospace;color:#756b71}pre{max-height:280px;overflow:auto;font:11px/1.6 monospace}summary{cursor:pointer;color:#986c7a}a{color:#986c7a;text-underline-offset:4px}
</style></head><body><main>
<h1>office026vera / Office Interaction System</h1>
<p>这是验收工具，内部加载当前真实网站。请悬停、点击或用 Tab 聚焦；下方记录实际 CSS 动画帧，不是截图模拟。</p>
<nav class="controls" aria-label="动画场景">
<button data-scene="about" aria-pressed="true">01 工牌抽取</button><button data-scene="project" aria-pressed="false">02 键帽按压</button><button data-scene="research" aria-pressed="false">03 小猫推车</button><button data-scene="formula" aria-pressed="false">04 实验显现</button><button data-scene="note" aria-pressed="false">05 便利贴掀角</button><button data-scene="file" aria-pressed="false">06 打开档案</button>
</nav>
<div class="controls"><label>视口 <select id="size"><option>1440 × 900</option><option>1920 × 1080</option><option>1366 × 768</option><option>1024 × 768</option><option>768 × 1024</option><option>430 × 932</option><option>390 × 844</option><option>375 × 667</option></select></label><label><input id="reduced" type="checkbox">模拟减少动态</label><label><input id="no-observer" type="checkbox">模拟无 Intersection Observer</label><button id="replay">重新访问 / 重播</button><button id="save">保存实测记录</button></div>
<p id="instruction">悬停任意工牌，或用 Tab 聚焦；点击仍直接进入原详情页。</p>
<div class="viewport" id="viewport"><iframe id="site" title="当前作品集的真实交互"></iframe></div>
<output id="state" aria-live="polite">正在载入…</output>
<details><summary>查看实测帧数据与环境信息</summary><pre id="trace">尚未触发动画</pre></details>
<p>演示中的减少动态与缺少 Observer 选项只作用于本验收框架，不保存设置、不改变主站。主站正常读取系统偏好。</p>
<a href="./">返回作品集 ↗</a>
</main><script type="module">
const scenes={about:['/about','.about-badge-grid','悬停任意工牌，或用 Tab 聚焦；点击仍直接进入原详情页。'],project:['/project','.project-keycap-press-area','悬停 PROJECT 键帽区域，整组轻压；不新增导航或音效。'],research:['/research/index','.research-index-entries','悬停研究目录条目或聚焦入口，观察对应小猫向右移动并返回。'],formula:['/lab/001',null,'向下滚动：每组首次进入视口时显现。向上返回不会重新隐藏。'],note:['/lab/index','.office-lab-index-entry','悬停或聚焦 LAB_003 / 004；便利贴与 HTML 状态文字一起轻微倾斜。'],file:['/about/skills',null,'点击“重新访问 / 重播”观察编号保持静止、标题先出现、正文随后出现。']};
let scene='about',records={},metrics={},generation=0,loadRequest=0,timer,cleanup=()=>{};
const frame=document.querySelector('#site'),state=document.querySelector('#state'),trace=document.querySelector('#trace');
function boot(route,reduced,noObserver){
 window.location.hash=route;
 if(reduced){const original=window.matchMedia.bind(window);window.matchMedia=query=>query.includes('prefers-reduced-motion')?{matches:true,media:query,onchange:null,addListener(){},removeListener(){},addEventListener(){},removeEventListener(){},dispatchEvent(){return true}}:original(query);}
 if(noObserver)Object.defineProperty(window,'IntersectionObserver',{value:undefined,configurable:true});
}
function fit(){const [width,height]=document.querySelector('#size').value.split(' × ').map(Number);frame.width=width;frame.height=height;const scale=Math.min(1,document.querySelector('#viewport').clientWidth/width);frame.style.transform=`scale(${scale})`;document.querySelector('#viewport').style.height=`${height*scale}px`;}
function inspect(d,w){
 const serial=++generation;let cls=0,observer,active=new WeakSet();records={};metrics={};trace.textContent='尚未触发动画';
 function sample(el,label){if(!el||active.has(el))return;active.add(el);const start=w.performance.now(),frames=[];function tick(t){if(serial!==generation)return;const c=w.getComputedStyle(el);frames.push({ms:Math.round(t-start),opacity:Number(c.opacity),transform:c.transform,animations:el.getAnimations().map(a=>({name:a.animationName||'transition',state:a.playState,time:Math.round(a.currentTime||0)}))});records[label]=frames;trace.textContent=JSON.stringify({metrics,records},null,2);if(t-start<550&&frames.length<40)w.requestAnimationFrame(tick);else active.delete(el)}w.requestAnimationFrame(tick)}
 function interaction(e){const el=e.target.closest?.('.about-id-card,.project-keycap-press-area,.research-index-row,.office-lab-index-entry');if(!el)return;const target=el.matches('.project-keycap-press-area')?el.parentElement.querySelector('img'):el.matches('.research-index-row')?el.querySelector('.research-index-cat'):el.matches('.office-lab-index-entry')?el.querySelector('.office-note'):el;sample(target,e.type+' / '+el.className);}
 function animation(e){if(e.animationName.startsWith('office-'))sample(e.target,e.animationName+' / '+e.target.className);}
 d.addEventListener('transitionrun',interaction,true);d.addEventListener('pointerover',interaction);d.addEventListener('focusin',interaction);d.addEventListener('animationstart',animation,true);
 try{observer=new w.PerformanceObserver(list=>{for(const e of list.getEntries())if(!e.hadRecentInput)cls+=e.value});observer.observe({type:'layout-shift',buffered:false});}catch{}
 timer=setInterval(()=>{const root=d.documentElement;metrics={scene,route:w.location.hash,viewport:[w.innerWidth,w.innerHeight],reducedQuery:w.matchMedia('(prefers-reduced-motion: reduce)').matches,reducedClass:root.classList.contains('office-motion-reduced'),observerAvailable:typeof w.IntersectionObserver!=='undefined',horizontalOverflow:root.scrollWidth>root.clientWidth,pendingSteps:d.querySelectorAll('[data-office-reveal="pending"]').length,visibleSteps:d.querySelectorAll('[data-office-reveal="visible"]').length,layoutShift:Number(cls.toFixed(5)),recordedEffects:Object.keys(records)};state.textContent=JSON.stringify(metrics,null,2);},180);
 cleanup=()=>{clearInterval(timer);observer?.disconnect();d.removeEventListener('transitionrun',interaction,true);d.removeEventListener('pointerover',interaction);d.removeEventListener('focusin',interaction);d.removeEventListener('animationstart',animation,true);};
 const wait=new MutationObserver(()=>{if(d.querySelector('main')){wait.disconnect();const target=scenes[scene][1];if(target)w.requestAnimationFrame(()=>d.querySelector(target)?.scrollIntoView({block:'center'}));}});wait.observe(d,{childList:true,subtree:true});if(d.querySelector('main')){wait.disconnect();const target=scenes[scene][1];if(target)d.querySelector(target)?.scrollIntoView({block:'center'});}
}
async function load(){const request=++loadRequest;cleanup();++generation;const [route,,instruction]=scenes[scene];document.querySelector('#instruction').textContent=instruction;state.textContent='正在载入…';document.querySelectorAll('[data-scene]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.scene===scene)));fit();const html=await fetch('./index.html',{cache:'no-store'}).then(r=>r.text());if(request!==loadRequest)return;const base=new URL('./',location.href).href;const setup=`<base href="${base}"><script>(${boot.toString()})(${JSON.stringify(route)},${document.querySelector('#reduced').checked},${document.querySelector('#no-observer').checked})<\/script>`;frame.onload=()=>{if(request===loadRequest)inspect(frame.contentDocument,frame.contentWindow);};frame.srcdoc=html.replace('<head>','<head>'+setup);}
document.querySelectorAll('[data-scene]').forEach(b=>b.onclick=()=>{scene=b.dataset.scene;load()});document.querySelector('#replay').onclick=load;document.querySelector('#size').onchange=load;document.querySelector('#reduced').onchange=load;document.querySelector('#no-observer').onchange=load;window.addEventListener('resize',fit);document.querySelector('#save').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({metrics,records},null,2)],{type:'application/json'}));a.download='office-motion-'+scene+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);};load();
</script></body></html>
